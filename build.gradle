plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.igniteprchecker'
// Release builds pass -Pappversion=<tag without 'v'> (see .github/workflows/release.yml); dev builds
// stay on -SNAPSHOT. The value is embedded via buildInfo() so the app knows its own version.
version = project.findProperty('appversion') ?: '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    // Generates META-INF/build-info.properties so BuildProperties (the app's own version) is available.
    buildInfo()
}

tasks.named('bootJar') {
    archiveFileName = 'ignite-pr-checker.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
