name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Names the file and line of a syntax error, also in a script no page test loads.
      - name: Check the page scripts
        run: |
          for f in src/main/resources/static/*.js; do
            node --check "$f"
          done

      # Names the section where a Russian doc says other than its English twin, or the setting the README leaves out.
      - name: Check the docs
        run: |
          chmod +x ./gradlew
          ./gradlew test --tests 'com.github.igniteprchecker.Doc*Test' --tests com.github.igniteprchecker.ReadmeSettingsTest

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/reports/jacoco/test/
