<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite PR Checker — Status</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#f36f21">
    <script>
        // Resolve the effective theme before first paint (no flash): saved choice, else system preference.
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
            if (t !== 'dark' && t !== 'light' && t !== 'jetbrains' && t !== 'terminal')
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root { --fg: #1a1a1a; --muted: #666; --line: #e2e2e2; --bad: #c0392b; --ok: #2e7d32; --accent: #1565c0; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; color: var(--fg); margin: 0; background: #fff; }
        a { color: var(--accent); }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
        .brand { font-weight: 600; }
        .brand small { color: var(--muted); font-weight: 400; margin-left: 0.4rem; }
        .topbar-right { display: flex; align-items: center; gap: 0.8rem; }
        .wrap { max-width: 960px; margin: 1.2rem auto; padding: 0 1rem; }
        .muted { color: var(--muted); }

        .mini-btn, .theme-btn { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; color: var(--accent); cursor: pointer; }
        .mini-btn { font-size: 0.8rem; padding: 0.2rem 0.55rem; }
        .mini-btn.danger { color: var(--bad); border-color: var(--bad); }
        .mini-btn.danger:hover { background: rgba(220, 60, 50, 0.12); border-color: var(--bad); }
        .pill { text-decoration: none; color: var(--fg); font-size: 0.85rem; border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.55rem; background: #fafafa; }
        .pill:hover { border-color: #c0c0c0; }
        .mini-btn { font-size: 0.8rem; padding: 0.2rem 0.55rem; }
        .mini-btn.danger { color: var(--bad); border-color: var(--bad); }
        .mini-btn.danger:hover { background: rgba(220, 60, 50, 0.12); border-color: var(--bad); }
        .theme-btn { font-size: 0.9rem; line-height: 1.2; padding: 0.22rem 0.5rem; color: var(--fg); }
        .theme-sel { font: inherit; font-size: 0.85rem; padding: 0.22rem 0.4rem; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; color: var(--fg); cursor: pointer; }
        .mini-btn:hover, .theme-btn:hover { border-color: #c0c0c0; }
        .mini-btn:disabled { opacity: 0.5; cursor: default; }
        .flush-msg { font-size: 0.8rem; color: var(--muted); margin-left: 0.5rem; }
        h2 .mini-btn { margin-left: 0.5rem; vertical-align: middle; }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.7rem; margin: 0.6rem 0 1.4rem; }
        .card { border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.9rem; }
        .card .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
        .card .v { font-size: 1.35rem; font-weight: 600; margin-top: 0.15rem; }
        .card .v small { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
        .card .v.ok { color: var(--ok); }
        .card .v.warn { color: #b26a00; }
        .card .v.bad { color: var(--bad); }

        h2 { font-size: 1.05rem; margin: 1.8rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); }
        h2:first-of-type { margin-top: 0.6rem; }
        .subhead { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 1rem 0 0.4rem; }
        .section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
        .chart-title { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.3rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.2rem 0.5rem; }
        .cat-legend { text-align: right; }
        canvas { width: 100%; height: 200px; display: block; }
        .legend span { font-size: 0.78rem; margin-left: 0.8rem; }
        .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 0.25rem; vertical-align: middle; }
        .rate-bad { color: var(--bad); }
        .bystatus { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
        .bystatus code { color: var(--bad); }
        .cats { display: flex; flex-direction: column; gap: 0.35rem; }
        .catrow { display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 0.6rem; font-size: 0.85rem; }
        .catname { font-family: ui-monospace, monospace; color: var(--accent); }
        .catbar { background: #f0f0f0; border-radius: 4px; height: 14px; overflow: hidden; }
        .catfill { background: var(--accent); height: 100%; }
        .catval { white-space: nowrap; }
        .catval small { color: var(--muted); }
        .hdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 0.5rem; vertical-align: middle; background: #bbb; }
        .hdot.ok { background: var(--ok); }
        .hdot.warn { background: #e0a000; }
        .hdot.error { background: var(--bad); }
        .loglist { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; font-family: ui-monospace, monospace; }
        .logrow { display: grid; grid-template-columns: 62px 46px 130px 1fr; gap: 0.5rem; align-items: baseline; }
        .logtime { color: var(--muted); }
        .loglevel { font-weight: 600; }
        .lvl-error { color: var(--bad); }
        .lvl-warn { color: #b26a00; }
        .loglogger { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .logmsg { word-break: break-word; }
        .updated { font-size: 0.78rem; color: var(--muted); text-align: right; margin: 0.9rem 0 0.2rem; }

        html[data-theme="dark"] {
            --fg: #e6e6e6; --muted: #9aa0a6; --line: #34383d; --bad: #ff6b5e; --ok: #66bb6a; --accent: #6ab0ff;
            body { background: #17191c; }
            .card, .section { background: #1c1f23; }
            .catbar { background: #2b2f34; }
            .lvl-warn { color: #d99a3a; }
            .mini-btn, .theme-btn, .theme-sel, .pill { background: #24282d; }
            .pill { color: var(--fg); }
            .mini-btn:hover, .theme-btn:hover, .pill:hover { border-color: #4a4f55; }
            .card .v.warn { color: #d99a3a; }
        }

        html[data-theme="jetbrains"] {
            --fg: #dfe1e5; --muted: #9da0a8; --line: #34383d; --bad: #fa6675; --ok: #6aab73; --accent: #548af7;
            body { background: #17191c; }
            .card, .section { background: #1c1f23; border-radius: 4px; }
            .catbar { background: #2b2f34; }
            .lvl-warn { color: #d5b778; }
            .mini-btn, .theme-btn, .theme-sel, .pill { background: #24282d; }
            .pill { color: var(--fg); }
            .mini-btn:hover, .theme-btn:hover, .pill:hover { border-color: #5a5d63; }
            .card .v.warn { color: #d5b778; }
            .mini-btn, .theme-sel, .pill { border-radius: 3px; }
        }

        html[data-theme="terminal"] {
            --fg: #c9d1d9; --muted: #8b949e; --line: #30363d; --bad: #f85149; --ok: #3fb950; --accent: #58a6ff;
            body { background: #0d1117; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
            .card, .section { background: #0d1117; border-radius: 2px; }
            .catbar { background: #21262d; }
            .lvl-warn { color: #d29922; }
            .mini-btn, .theme-btn, .theme-sel, .pill { background: transparent; }
            .pill { color: var(--fg); }
            .mini-btn:hover, .theme-btn:hover, .pill:hover { border-color: #8b949e; }
            .card .v.warn { color: #d29922; }
            .mini-btn, .theme-sel, .pill, .card { border-radius: 2px; }
            .mini-btn { border: none; background: transparent; padding: 0 0.05rem; }
            .mini-btn::before { content: "["; color: var(--muted); }
            .mini-btn::after { content: "]"; color: var(--muted); }
            .mini-btn:hover { text-decoration: underline; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">Ignite PR Checker <small>service status</small><span id="healthDot" class="hdot" title="health"></span></div>
        <div class="topbar-right">
            <select id="theme-toggle" class="theme-sel" title="Theme" aria-label="Theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="jetbrains">JetBrains</option>
                <option value="terminal">Terminal</option>
            </select>
            <a class="pill" href="/" target="_self">← App</a>
        </div>
    </header>

    <div class="wrap">
        <div id="err" class="muted"></div>

        <h2>System
            <button id="restartBtn" class="mini-btn danger" type="button"
                title="Restart the service — it will be unavailable for ~10 seconds">Restart service</button>
            <span id="restartMsg" class="flush-msg"></span>
        </h2>
        <div class="cards" id="systemCards"></div>

        <h2>Analysis &amp; requests</h2>
        <div class="cards" id="appCards"></div>
        <div class="subhead">Served requests by endpoint · own latency, last hour</div>
        <div class="section"><div id="httpCats" class="cats"></div></div>

        <h2>Cache warmer
            <button id="flushBtn" class="mini-btn" type="button"
                title="Drop cached analysis results &amp; per-test history; the next analysis recomputes from scratch">Flush caches</button>
            <span id="flushMsg" class="flush-msg"></span>
        </h2>
        
        <div class="cards" id="warmerCards"></div>

        <h2>TeamCity</h2>
        <div class="cards" id="tcCards"></div>
        <div class="subhead">Requests per minute · by category, last hour</div>
        <div class="section">
            <div class="chart-title"><span>calls / minute</span><span id="stackLegend" class="legend cat-legend"></span></div>
            <canvas id="tcStack"></canvas>
            <div id="tcByStatus" class="bystatus"></div>
        </div>
        <div class="subhead">Calls by category · last hour</div>
        <div class="section"><div id="tcCats" class="cats"></div></div>

        <h2>GitHub</h2>
        <div class="cards" id="ghCards"></div>
        <div class="subhead">Calls by category · last hour</div>
        <div class="section"><div id="ghCats" class="cats"></div></div>

        <h2>Logs &amp; errors</h2>
        <div class="cards" id="logCards"></div>
        <div class="section"><div id="logList" class="loglist"></div></div>

        <div class="updated" id="updated"></div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        function fmtDur(s) {
            s = Math.floor(s);
            const d = Math.floor(s / 86400); s %= 86400;
            const h = Math.floor(s / 3600); s %= 3600;
            const m = Math.floor(s / 60); s %= 60;
            if (d) return `${d}d ${h}h ${m}m`;
            if (h) return `${h}h ${m}m`;
            if (m) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function card(k, v, sub, cls) {
            return `<div class="card"><div class="k">${k}</div><div class="v ${cls || ''}">${v}${sub ? ` <small>${sub}</small>` : ''}</div></div>`;
        }

        // Traffic-light severity for higher-is-worse values: below warnAt = ok, below badAt = warn, else bad.
        function sev(value, warnAt, badAt) {
            return value < warnAt ? 'ok' : value < badAt ? 'warn' : 'bad';
        }

        function agoShort(ms) {
            if (!ms) return '—';
            const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return s + 's ago';
            const m = Math.round(s / 60);
            return m < 60 ? m + 'm ago' : Math.round(m / 60) + 'h ago';
        }

        function secs(ms) {
            if (!ms || ms < 0) return '0s';
            const s = ms / 1000;
            return (s < 10 ? s.toFixed(1) : Math.round(s)) + 's';
        }

        // Warmer's current state, traffic-lit: warming = amber, failures in the last cycle = red,
        // a clean completed cycle = green, nothing to judge yet = neutral.
        function warmerCard(a) {
            if (a.warmerRunning) {
                const prog = a.cycleTotal ? `${a.cycleDone}/${a.cycleTotal} PRs` : '';
                const el = a.cycleStartedAt ? secs(Date.now() - a.cycleStartedAt) + ' elapsed' : '';
                return card('Warmer', 'warming…', [prog, el].filter(Boolean).join(' · '), 'warn');
            }
            if (a.lastFailed > 0)
                return card('Warmer', agoShort(a.lastWarmCycleAt), `${a.lastFailed} warm${a.lastFailed === 1 ? '' : 's'} failed last cycle`, 'bad');
            if (a.lastWarmCycleAt)
                return card('Warmer', agoShort(a.lastWarmCycleAt), `${a.cyclesCompleted} cycle${a.cyclesCompleted === 1 ? '' : 's'} run`, 'ok');
            return card('Warmer', 'idle', 'no cycle yet');
        }

        // The initial post-restart warm-up: amber while it's still going, green once done.
        function startupCard(a) {
            if (a.firstCycleMs > 0) return card('Startup warm-up', secs(a.firstCycleMs), 'completed', 'ok');
            if (a.warmerRunning && a.cycleStartedAt) return card('Startup warm-up', secs(Date.now() - a.cycleStartedAt) + '…', 'in progress', 'warn');
            return card('Startup warm-up', '—', 'pending');
        }

        function lastCycleCard(a) {
            if (!a.lastWarmCycleAt) return card('Last cycle', '—', 'none yet');
            return card('Last cycle', secs(a.lastCycleMs), `${a.lastWarmed} recomputed · ${a.lastCached} cached`);
        }

        function render(d) {
            const tc = d.teamcity, gh = d.github, j = d.jvm;
            const t = tc.lastHour, g = gh.lastHour;
            const tcRate = t.total ? (100 * t.ok / t.total) : 100;
            const az = (d.http && d.http.byCategory && d.http.byCategory['/api/analyze']) || null;
            $('healthDot').className = 'hdot ' + (d.health || 'ok');
            $('healthDot').title = d.health === 'error' ? 'errors logged' : d.health === 'warn' ? 'warnings logged' : 'healthy';
            $('systemCards').innerHTML = [
                card('Version', d.version),
                card('Uptime', fmtDur(d.uptimeSeconds)),
                card('CPU', j.systemCpuPct == null || j.systemCpuPct < 0 ? '—' : j.systemCpuPct + '%',
                    j.processCpuPct >= 0 ? `${j.processCpuPct}% this app` : 'host',
                    j.systemCpuPct >= 0 ? sev(j.systemCpuPct, 50, 80) : ''),
                card('Load avg', j.loadAverage == null || j.loadAverage < 0 ? '—' : j.loadAverage,
                    `on ${j.cpus} cpu`,
                    j.loadAverage >= 0 ? sev(j.loadAverage / j.cpus, 0.7, 1.001) : ''),
                card('Heap', j.heapUsedMb, `/ ${j.heapMaxMb} MB`,
                    j.heapMaxMb ? sev(100 * j.heapUsedMb / j.heapMaxMb, 60, 85) : ''),
                card('Threads', j.threads, `· ${j.cpus} cpu`),
            ].join('');

            $('appCards').innerHTML = [
                card('Analyze (1h)', az ? `${az.avgLatencyMs}` : '—',
                    az ? `ms avg · ${az.maxLatencyMs} max · ${az.total} calls` : 'no requests',
                    az ? sev(az.avgLatencyMs, 500, 2000) : ''),
                card('Open PRs', d.app.openPrs),
            ].join('');

            $('warmerCards').innerHTML = [
                warmerCard(d.app),
                startupCard(d.app),
                lastCycleCard(d.app),
                card('Pooled tokens', d.app.pooledTokens, d.app.pooledTokens ? '' : 'warmer paused — log in',
                    d.app.pooledTokens ? 'ok' : 'warn'),
                card('Results cached', d.app.resultsCached),
                card('History cached', d.app.historyCached, 'tests'),
            ].join('');

            $('tcCards').innerHTML = [
                card('TeamCity (1h)', t.total.toLocaleString(),
                    `${tcRate.toFixed(1)}% ok · ${tc.sinceStart.toLocaleString()} total`,
                    t.total ? (tcRate >= 99 ? 'ok' : tcRate >= 95 ? 'warn' : 'bad') : ''),
                card('TC latency (1h)', `${t.avgLatencyMs}`, `ms avg · ${t.maxLatencyMs} max`,
                    t.total ? sev(t.avgLatencyMs, 500, 2000) : ''),
            ].join('');

            $('ghCards').innerHTML = [
                card('GitHub (1h)', g.total.toLocaleString(), `${g.fail} failed · ${gh.sinceStart.toLocaleString()} total`,
                    g.total ? (g.fail === 0 ? 'ok' : g.fail <= 5 ? 'warn' : 'bad') : ''),
                card('Stars', d.app.stars < 0 ? '—' : d.app.stars),
                card('GitHub API', d.app.githubRate && d.app.githubRate.limit ? d.app.githubRate.remaining : '—',
                    d.app.githubRate && d.app.githubRate.limit ? `/ ${d.app.githubRate.limit} left` : '',
                    d.app.githubRate && d.app.githubRate.limit
                        ? (100 * d.app.githubRate.remaining / d.app.githubRate.limit > 50 ? 'ok'
                            : 100 * d.app.githubRate.remaining / d.app.githubRate.limit > 10 ? 'warn' : 'bad') : ''),
            ].join('');

            $('logCards').innerHTML = [
                card('Log issues', d.log.errors, `${d.log.warnings} warn`,
                    d.log.errors ? 'bad' : d.log.warnings ? 'warn' : 'ok'),
            ].join('');

            const byStatus = Object.entries(tc.byStatus || {});
            $('tcByStatus').innerHTML = byStatus.length
                ? 'Failures by status <span class="muted">· HTTP code × times · since start</span>: ' + byStatus.map(([s, n]) => `<code>${s === '0' ? 'network' : s}</code>×${n}`).join(', ')
                : (t.total ? 'No TeamCity failures recorded.' : 'No TeamCity calls yet.');

            renderCats($('tcCats'), tc.byCategory || {});
            renderCats($('ghCats'), gh.byCategory || {});
            renderCats($('httpCats'), (d.http && d.http.byCategory) || {});
            renderLog($('logList'), d.log || { recent: [] });

            drawStacked($('tcStack'), $('stackLegend'), tc.perMinuteByCategory || {});
            $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
        }

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        function renderLog(el, log) {
            const recent = log.recent || [];
            if (!recent.length) { el.innerHTML = '<div class="muted">no warnings or errors logged</div>'; return; }
            el.innerHTML = recent.map(e => `<div class="logrow">
                <span class="logtime">${new Date(e.t).toLocaleTimeString()}</span>
                <span class="loglevel lvl-${e.level.toLowerCase()}">${e.level}</span>
                <span class="loglogger" title="${esc(e.logger)}">${esc(e.logger)}</span>
                <span class="logmsg">${esc(e.message)}</span>
            </div>`).join('');
        }

        function renderCats(el, byCategory) {
            const entries = Object.entries(byCategory);
            if (!entries.length) { el.innerHTML = '<div class="muted">no calls yet</div>'; return; }
            const max = Math.max(1, ...entries.map(([, s]) => s.total));
            el.innerHTML = entries.map(([name, s]) => {
                const pct = 100 * s.total / max;
                const fail = s.fail ? ` · <span class="rate-bad">${s.fail} failed</span>` : '';
                return `<div class="catrow">
                    <div class="catname">${name}</div>
                    <div class="catbar"><div class="catfill" style="width:${pct.toFixed(1)}%"></div></div>
                    <div class="catval">${s.total.toLocaleString()} <small>${s.avgLatencyMs}ms${fail}</small></div>
                </div>`;
            }).join('');
        }

        const CAT_COLORS =['#1565c0', '#2e7d32', '#c0392b', '#e0a000', '#6a1b9a', '#00838f',
            '#8d6e63', '#ad1457', '#7cb342', '#f4511e', '#0277bd', '#9e9d24'];

        // Stacked per-minute bars: each minute split into category-coloured segments (last hour).
        function drawStacked(canvas, legendEl, byCat) {
            const cats = Object.keys(byCat);
            const dpr = window.devicePixelRatio || 1;
            const cssW = canvas.clientWidth || 880, cssH = 200;
            canvas.width = cssW * dpr; canvas.height = cssH * dpr;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);

            const pad = { l: 34, r: 6, t: 6, b: 16 }, N = 60;
            const cw = cssW - pad.l - pad.r, ch = cssH - pad.t - pad.b;
            const totals = new Array(N).fill(0);
            cats.forEach(c => (byCat[c] || []).forEach((v, i) => totals[i] += v));
            const max = Math.max(1, ...totals);

            ctx.font = '10px system-ui';
            for (let k = 0; k <= 4; k++) {
                const y = pad.t + ch - (ch * k / 4);
                ctx.strokeStyle = 'rgba(128,128,128,0.18)'; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.fillText(Math.round(max * k / 4), 2, y + 3);
            }

            const bw = cw / N;
            for (let i = 0; i < N; i++) {
                let yTop = pad.t + ch;
                cats.forEach((c, ci) => {
                    const v = (byCat[c] || [])[i] || 0;
                    if (!v) return;
                    const h = ch * v / max;
                    ctx.fillStyle = CAT_COLORS[ci % CAT_COLORS.length];
                    ctx.fillRect(pad.l + i * bw + 0.5, yTop - h, Math.max(1, bw - 1), h);
                    yTop -= h;
                });
            }
            ctx.fillStyle = '#999'; ctx.fillText('-60m', pad.l, cssH - 4); ctx.fillText('now', cssW - pad.r - 18, cssH - 4);
            legendEl.innerHTML = cats.map((c, ci) =>
                `<span><span class="dot" style="background:${CAT_COLORS[ci % CAT_COLORS.length]}"></span>${c}</span>`).join('');
        }

        let last = null;
        async function tick() {
            try {
                const r = await fetch('/api/status', { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                last = await r.json();
                $('err').textContent = '';
                render(last);
            } catch (e) {
                // A failed poll with data already on screen is usually a redeploy/restart blip: stay calm,
                // keep the cards, and let the next poll clear this. Alarm only when there's nothing to show.
                $('err').textContent = last ? 'connection lost — retrying…' : 'status unavailable: ' + e.message;
            }
        }

        window.addEventListener('resize', () => {
            if (!last) return;
            drawStacked($('tcStack'), $('stackLegend'), last.teamcity.perMinuteByCategory || {});
        });
        $('restartBtn').addEventListener('click', async () => {
            if (!confirm('Restart the service?\n\nIt will be unavailable for ~10 seconds; in-flight analyses are dropped (caches are saved).')) return;
            const btn = $('restartBtn'), msg = $('restartMsg');
            btn.disabled = true;
            msg.textContent = 'restarting…';
            let accepted = false;
            try {
                const r = await fetch('/api/restart', { method: 'POST' });
                if (r.status === 401) { msg.textContent = 'log in on the main page first'; btn.disabled = false; return; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                accepted = true;
            } catch (e) { msg.textContent = 'restart request failed'; btn.disabled = false; }
            if (!accepted) return;
            const t0 = Date.now();
            const timer = setInterval(async () => {
                try {
                    const v = await fetch('/api/version', { cache: 'no-store' });
                    if (v.ok) { clearInterval(timer); msg.textContent = 'back up'; setTimeout(() => location.reload(), 800); return; }
                } catch (e) { /* still down */ }
                if (Date.now() - t0 > 120000) { clearInterval(timer); msg.textContent = 'still down after 2 minutes — check the server'; }
            }, 2000);
        });

        $('flushBtn').addEventListener('click', async () => {
            if (!confirm('Clear cached analysis results and per-test history?\nThe next analysis will recompute from scratch (extra TeamCity load).')) return;
            const btn = $('flushBtn'), msg = $('flushMsg');
            btn.disabled = true; msg.textContent = 'flushing…';
            try {
                const r = await fetch('/api/flush-caches', { method: 'POST', cache: 'no-store' });
                if (r.status === 401) { msg.textContent = 'log in on the main page to flush'; return; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const c = await r.json();
                msg.textContent = `cleared ${c.results} result(s), ${c.history} history entr${c.history === 1 ? 'y' : 'ies'}`;
                tick();
            } catch (e) {
                msg.textContent = 'flush failed: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        });

        // Theme toggle (the head script already applied the effective theme; persist only explicit clicks).
        (function () {
            const sel = $('theme-toggle');
                sel.value = document.documentElement.getAttribute('data-theme') || 'light';
                sel.addEventListener('change', () => {
                    const t = sel.value;
                    document.documentElement.setAttribute('data-theme', t);
                    try { localStorage.setItem('theme', t); } catch (e) { /* private mode */ }
            });
        })();

        tick();
        setInterval(tick, 5000);
    </script>
</body>
</html>
