<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite PR Checker — Master</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#1cb6ed">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/common.css">
    <style>
        body { margin: 0; }
        .wrap { margin: 0.9rem auto 1.2rem; padding: 0 1.2rem; }
        /* A run's bar and the gap after it; the columns the rows and their headings share. */
        :root { --bar: 2px; }
        .board { --strip-w: calc(var(--runs) * (var(--bar) + 1px) - 1px); }

        .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; margin-bottom: 0.8rem; }
        .what { font-size: 0.85rem; color: var(--muted); }
        .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .chip { font-size: 0.82rem; padding: 0.15rem 0.6rem; border-radius: 999px; background: var(--fill); color: var(--fg); text-decoration: none; white-space: nowrap; }
        .chip:hover { background: var(--sel); }
        .chip b { font-variant-numeric: tabular-nums; }
        .chip.bad, .chip.bad:hover { background: var(--bad-bg); color: var(--bad); }
        .chip.calm, .chip.calm:hover { background: var(--ok-bg); color: var(--ok); }
        .summary .right { margin-left: auto; display: flex; align-items: center; gap: 0.7rem; }
        .legend { font-size: 0.72rem; color: var(--muted); display: inline-flex; align-items: flex-end; gap: 0.3rem; white-space: nowrap; cursor: help; }
        .legend i { display: inline-block; width: 3px; border-radius: 1px; }
        .legend .lp { height: 4px; background: var(--pass); }
        .legend .lf { height: 14px; background: var(--bad); }
        #q { width: 14rem; max-width: 100%; font-size: 0.85rem; padding: 0.2rem 0.45rem; border-color: var(--line-strong); border-radius: var(--radius-small); }

        .section { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--card-bg); padding: 0.7rem 0.6rem 0.5rem; margin-bottom: 0.8rem; }
        .sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.2rem 0.7rem; padding: 0 0.5rem; }
        .sec-head h2 { font-size: 1rem; margin: 0; }
        .sec-head h2 button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
        .count { font-size: 0.82rem; font-weight: 400; color: var(--muted); }
        .sub { font-size: 0.8rem; color: var(--muted); margin: 0; }
        .empty { padding: 0.5rem; font-size: 0.85rem; color: var(--muted); }
        .empty.calm { color: var(--ok); }

        .cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) var(--strip-w) 6.4rem 7.6rem 4.2rem 0.9rem; column-gap: 0.9rem; align-items: center; padding: 0 0.5rem; }
        .cols { margin-top: 0.45rem; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; align-items: end; padding-bottom: 0.15rem; border-bottom: 1px solid var(--line); }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .cols .num { white-space: normal; }
        .cols button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; }
        .cols button:hover, .cols button[aria-pressed="true"] { color: var(--fg); }

        .row { min-height: 1.75rem; border-radius: var(--radius-small); cursor: pointer; font-size: 0.82rem; }
        .row:hover, .row.open { background: var(--row-hover); }
        .name { display: flex; align-items: baseline; min-width: 0; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; white-space: nowrap; }
        .name .suite { flex: 0 0 auto; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: pre; color: var(--muted); }
        .name .cls { flex: 0 4 auto; min-width: 3rem; overflow: hidden; text-overflow: ellipsis; }
        .name .cls:empty { display: none; }
        .name .meth { flex: 0 2 auto; min-width: 4rem; overflow: hidden; text-overflow: ellipsis; }
        /* A suite's row: its name as the page writes names, then a tag for each kind of problem. */
        .name.plain { font-family: inherit; font-size: 0.85rem; }
        .name.plain .sname { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .name.plain .tag { flex: none; margin-left: 0.45rem; }
        .row:hover .name.plain .tag, .row.open .name.plain .tag { background: var(--card-bg); }
        /* One bar a run, the oldest on the left. A failed run is a full red bar, a passed one a low bar: the height
           tells them apart where the colour does not. */
        .strip { display: grid; grid-template-columns: repeat(var(--runs), 1fr); column-gap: 1px; align-items: end; height: 16px; width: var(--strip-w); }
        .strip i { display: block; height: 4px; background: var(--pass); border-radius: 1px; }
        .strip i.f { height: 16px; background: var(--bad); }
        .strip i.h { height: 16px; background: var(--ok); box-shadow: 0 0 0 1px var(--fg); }
        .strip i.f.h { background: var(--bad); }
        .strip-note { font-size: 0.72rem; color: var(--muted); }
        .num small { font-size: 0.72rem; color: var(--muted); margin-left: 0.25rem; }
        .rate { font-weight: 600; }
        .rate.warm { color: var(--warn); }
        .rate.hot, .rise { color: var(--bad); }
        .rise { font-size: 0.75rem; margin-left: 0.3rem; cursor: help; }
        .caret { color: var(--muted); font-size: 0.7rem; }

        .details { margin: 0.1rem 0.5rem 0.5rem; padding: 0.5rem 0.7rem; background: var(--details-bg); border-radius: var(--radius); font-size: 0.8rem; }
        .details p { margin: 0 0 0.3rem; }
        .details .full { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.76rem; word-break: break-all; }
        .details pre { margin: 0.3rem 0 0; font-size: 0.72rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
        .details pre .why { margin-left: 0.3rem; }
        .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin: 0.4rem 0; }
        .acts a.ext { margin: 0; }
        .live { font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.45em; border-radius: var(--radius-tag); text-decoration: none; white-space: nowrap; }
        .live.running { background: var(--ok-bg); color: var(--ok); }
        .live.queued { background: var(--warn-bg); color: var(--warn); }
        .more { display: block; margin: 0.25rem 0.5rem 0; }

        /* A cause: the tests that began to fail on the same commit. */
        .cause { padding: 0.45rem 0 0.3rem; }
        .cause + .cause { border-top: 1px solid var(--line); }
        .cause-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0 0.5rem; font-size: 0.85rem; }
        .cause-head .when { font-weight: 600; cursor: help; }
        .cause-head .why { margin-left: auto; }
        .commits { margin: 0.2rem 0.5rem 0.3rem; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .commits span { cursor: help; }
        .commits ul { list-style: none; margin: 0.15rem 0 0; padding: 0; }
        .commits li { padding: 0.08rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .commits code { font-size: 0.74rem; color: var(--muted); margin-right: 0.4rem; }

        #tip { position: fixed; z-index: 10; pointer-events: none; font-size: 0.74rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-small); background: var(--fg); color: var(--bg); white-space: nowrap; }
        .updated { font-size: 0.75rem; color: var(--muted); text-align: right; margin: 0.2rem 0; }
        #updated:not(:empty)::after { content: " · "; }

        html[data-theme="terminal"] {
            .live { padding: 0 0.15rem; }
        }
        @media (min-width: 1700px) {
            :root { --bar: 3px; }
        }
        /* The name takes a line of its own, and the runs with the numbers go under it; each number says what it is,
           as the column headings are gone. */
        @media (max-width: 1050px) {
            .cols, .caret { display: none; }
            .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem 0.9rem; padding: 0.3rem 0.5rem; }
            .name { flex: 0 0 100%; flex-wrap: wrap; white-space: normal; }
            .name .suite { max-width: 100%; }
            .name .cls, .name .meth { overflow: visible; word-break: break-all; }
            .strip { flex: 0 1 var(--strip-w); width: auto; min-width: 0; }
            .num:empty { display: none; }
            .num[data-label]::before { content: attr(data-label) " "; font-size: 0.72rem; color: var(--muted); }
            .commits, .commits li { white-space: normal; }
            .summary .right { margin-left: 0; }
        }
        @media (max-width: 768px) {
            .wrap { padding: 0 0.75rem; }
            /* The Russian chip of a re-run is longer than a phone is wide. */
            html[lang="ru"] .live { white-space: normal; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/ignite" title="Start page">Ignite PR Checker</a>
        <nav class="menu" aria-label="Pages">
            <a href="/ignite" target="_self" title="Shows the open PRs and their verdicts.">PRs</a>
            <a href="/flaky.html" target="_self" aria-current="page" title="Shows what fails on master: broken tests, problem suites, flaky tests.">Master</a>
            <a href="/status.html" target="_self" title="Shows the service status and metrics.">Status</a>
        </nav>
        <div class="topbar-right">
            <button id="reloadPill" class="update-btn hidden" type="button"
                title="This page's code was updated by a deploy — reload to get the new UI">UI updated — reload</button>
            <a class="star-btn" href="https://github.com/anton-vinogradov/ignite-pr-checker"
               target="_self" rel="noopener" title="Star this project on GitHub">
                <svg class="star-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M8 12.472l-4.702 2.833 1.248-5.351L.42 6.354l5.472-.464L8 .833l2.108 5.057 5.472.464-4.126 3.6 1.248 5.351z"/>
                </svg>
                <span>Star</span>
            </a>
            <select id="theme-toggle" class="theme-sel" title="Theme" aria-label="Theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="jetbrains">JetBrains</option>
                <option value="terminal">Terminal</option>
            </select>
        </div>
    </header>

    <div class="wrap">
        <div id="err" class="muted"></div>
        <div class="summary">
            <span id="what" class="what"></span>
            <span id="chips" class="chips"></span>
            <span class="right">
                <span class="legend" title="One bar is one finished master run, the oldest on the left."><i class="lp"></i>passed <i class="lf"></i>failed</span>
                <input type="search" id="q" placeholder="Filter by suite or test" aria-label="Filter by suite or test">
                <a class="help" href="https://github.com/anton-vinogradov/ignite-pr-checker/blob/main/docs/features.md#the-master-board-flakyhtml" target="_self" rel="noopener" title="Opens the docs on GitHub that explain how this board works." aria-label="Opens the docs on GitHub that explain how this board works.">?</a>
            </span>
        </div>
        <div id="flaky"></div>
        <div class="updated"><span id="updated"></span><span id="intro">Tests muted on TeamCity are not shown.</span></div>
    </div>
    <div id="tip" class="hidden"></div>

    <script src="/common.js"></script>
    <script src="/flaky.js"></script>
</body>
</html>
