<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite PR Checker — Flaky tests</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#1cb6ed">
    <script>
        // Resolve the effective theme before first paint (no flash): saved choice, else system preference.
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
            if (t !== 'dark' && t !== 'light' && t !== 'jetbrains' && t !== 'terminal')
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root { --fg: #1a1a1a; --muted: #666; --line: #e2e2e2; --bad: #c0392b; --accent: #1565c0; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; color: var(--fg); margin: 0; background: #fff; }
        a { color: var(--accent); }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
        .brand { font-weight: 600; }
        .brand small { color: var(--muted); font-weight: 400; margin-left: 0.4rem; }
        .topbar-right { display: flex; align-items: center; gap: 0.8rem; }
        .theme-btn { font: inherit; font-size: 0.9rem; line-height: 1.2; padding: 0.22rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; color: var(--fg); cursor: pointer; }
        .theme-sel { font: inherit; font-size: 0.85rem; padding: 0.22rem 0.4rem; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; color: var(--fg); cursor: pointer; }
        .theme-btn:hover { border-color: #c0c0c0; }
        .wrap { margin: 1.2rem auto; padding: 0 1.5rem; }
        .muted { color: var(--muted); }
        .section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }

        .leaderboard { display: flex; flex-direction: column; }
        .lbrow { padding: 0.4rem 0; }
        .lbhead { display: flex; align-items: baseline; gap: 0.5rem; }
        .lbrank { color: var(--muted); font-variant-numeric: tabular-nums; }
        .lbname { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; display: inline-flex; align-items: center; flex-wrap: wrap; column-gap: 0.35rem; row-gap: 0.1rem; }
        .lbname a.ext, .lbname .why, .lbname .strip, .lbname .live { margin: 0; }
        .lbsuite { color: var(--muted); }
        .lbcount { margin-left: auto; white-space: nowrap; }
        .flake { font-weight: 600; }
        .flake.warm { color: #b26a00; }
        .flake.hot { color: var(--bad); }
        .foot { color: var(--muted); font-size: 0.78rem; margin-left: 0.45rem; }
        .lbprs { font-size: 0.78rem; margin: 0.15rem 0 0 1.6rem; }
        .lbprs a { margin-right: 0.4rem; font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.45em; border-radius: 4px; text-decoration: none; background: #eef3fb; }
        .strip { display: inline-flex; gap: 1px; margin-left: 0.5rem; vertical-align: middle; }
        .run { width: 3px; height: 12px; border-radius: 1px; }
        .run-p { background: #2e7d32; }
        .run-f { background: #c0392b; }
        .live { font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.45em; border-radius: 4px; margin-left: 0.45rem; text-decoration: none; vertical-align: middle; white-space: nowrap; }
        .live.running { background: #e6f4ea; color: #2e7d32; }
        .live.queued { background: #fff3e0; color: #b26a00; }
        .pill { text-decoration: none; color: var(--fg); font-size: 0.85rem; border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.55rem; background: #fafafa; }
        .pill:hover { border-color: #c0c0c0; }
        .reload-pill { color: #fff; background: var(--accent); border-color: var(--accent); cursor: pointer; }
        a.ext { font-size: 0.72rem; font-weight: 500; padding: 0.1rem 0.45rem; border-radius: 5px; margin: 0 0.3em; border: 1px solid var(--line); background: #fafafa; color: var(--accent); text-decoration: none; vertical-align: middle; white-space: nowrap; }
        a.ext:hover { border-color: #c0c0c0; }
        .why { font-size: 0.72rem; font-weight: 500; padding: 0.1rem 0.45rem; border-radius: 5px; margin-left: 0.35rem; border: 1px solid var(--line); background: #fafafa; color: var(--accent); cursor: pointer; vertical-align: middle; }
        .why:hover { border-color: #c0c0c0; }
        .details { position: relative; margin: 0.3rem 0 0.1rem 1.6rem; background: #f7f7f7; border-radius: 6px; }
        .details pre { margin: 0; padding: 0.5rem 3.2rem 0.5rem 0.7rem; font-size: 0.72rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
        .details .copy { position: absolute; top: 0.3rem; right: 0.3rem; font-size: 0.68rem; padding: 0.05rem 0.4rem; border: 1px solid var(--line); border-radius: 5px; background: #fafafa; color: var(--muted); cursor: pointer; }
        .details .copy:hover { color: var(--fg); border-color: #c0c0c0; }
        .details.hidden { display: none; }
        .updated { font-size: 0.78rem; color: var(--muted); text-align: right; margin: 0.9rem 0 0.2rem; }

        html[data-theme="dark"] {
            --fg: #e6e6e6; --muted: #9aa0a6; --line: #34383d; --bad: #ff6b5e; --accent: #6ab0ff;
            body { background: #17191c; }
            .section { background: #1c1f23; }
            .live.running { background: #1e3324; color: #7fce90; }
            .live.queued { background: #33290f; color: #d99a3a; }
            .theme-btn, .theme-sel, .why, .pill, a.ext { background: #24282d; }
            a.ext:hover { border-color: #4a4f55; }
            .pill:hover { border-color: #4a4f55; }
            .lbprs a { background: #232a33; }
            .theme-btn:hover, .why:hover { border-color: #4a4f55; }
            .details { background: #1f2328; }
            .flake.warm { color: #d99a3a; }
        }

        html[data-theme="jetbrains"] {
            --fg: #dfe1e5; --muted: #9da0a8; --line: #34383d; --bad: #fa6675; --accent: #548af7;
            body { background: #17191c; }
            .section { background: #1c1f23; border-radius: 4px; }
            .live.running { background: #253b2a; color: #6aab73; }
            .live.queued { background: #3d3223; color: #d5b778; }
            .theme-btn, .theme-sel, .why, .pill, a.ext { background: #24282d; }
            .why, a.ext { color: var(--accent); }
            .theme-btn:hover, .why:hover, .pill:hover, a.ext:hover { border-color: #5a5d63; }
            .lbprs a { background: #24282d; }
            .details { background: #1f2328; }
            .flake.warm { color: #d5b778; }
            .theme-sel, .pill, .why, a.ext, .live, .lbprs a { border-radius: 3px; }
        }

        html[data-theme="terminal"] {
            --fg: #c9d1d9; --muted: #8b949e; --line: #30363d; --bad: #f85149; --accent: #58a6ff;
            body { background: #0d1117; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
            .section { background: #0d1117; border-radius: 2px; }
            .live.running { background: transparent; color: #3fb950; border: none; padding: 0 0.15rem; }
            .live.queued { background: transparent; color: #d29922; border: none; padding: 0 0.15rem; }
            .theme-btn, .theme-sel, .why, .pill, a.ext { background: transparent; }
            .why, a.ext { color: var(--accent); }
            .theme-btn:hover, .why:hover, .pill:hover, a.ext:hover { border-color: #8b949e; }
            .lbprs a { background: transparent; border: none; padding: 0 0.1rem; }
            .details { background: #161b22; }
            .flake.warm { color: #d29922; }
            .run-p { background: #3fb950; }
            .run-f { background: #f85149; }
            .theme-sel, .pill, .why, a.ext, .live, .lbprs a, .details { border-radius: 2px; }
            .why, a.ext { border: none; background: transparent; padding: 0 0.05rem; }
            .why::before, a.ext::before { content: "["; color: var(--muted); }
            .why::after, a.ext::after { content: "]"; color: var(--muted); }
            .why:hover, a.ext:hover { text-decoration: underline; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">Ignite PR Checker <small>flaky tests · fix-master queue</small></div>
        <div class="topbar-right">
            <button id="reloadPill" class="pill reload-pill hidden" type="button"
                title="This page's code was updated by a deploy — reload to get the new UI">UI updated — reload</button>
            <select id="theme-toggle" class="theme-sel" title="Theme" aria-label="Theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="jetbrains">JetBrains</option>
                <option value="terminal">Terminal</option>
            </select>
            <a class="pill" href="/status.html" target="_self">Status</a>
            <a class="pill" href="/" target="_self">← App</a>
        </div>
    </header>

    <div class="wrap">
        <div id="err" class="muted"></div>
        <div class="section"><div id="flaky" class="leaderboard"></div></div>
        <div class="updated" id="updated"></div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        // A long-lived tab can't hot-swap its own code: when a deploy changes this page, offer a reload.
        (function () {
            let baseline = null;
            async function check() {
                try {
                    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
                    const lm = r.headers.get('last-modified');
                    if (!lm) return;
                    if (baseline === null) { baseline = lm; return; }
                    if (lm !== baseline) document.getElementById('reloadPill').classList.remove('hidden');
                } catch (e) { /* offline blip: try again next tick */ }
            }
            check();
            setInterval(check, 120000);
            document.getElementById('reloadPill').onclick = () => location.reload();
        })();

        let tcBase = '';
        let lastJson = ''; // only re-render on change, so an open "why?" isn't wiped by the poll

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // "Class.method[params]" without the package/namespace (dots inside (...)/[...] kept intact).
        function shortTestName(name) {
            let s = name.includes(': ') ? name.slice(name.indexOf(': ') + 2) : name;
            const noMethod = s.endsWith('.');
            let depth = 0, seg = '', segs = [];
            for (const ch of s) {
                if (ch === '(' || ch === '[') depth++;
                else if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
                if (ch === '.' && depth === 0) { segs.push(seg); seg = ''; }
                else seg += ch;
            }
            segs.push(seg);
            segs = segs.filter(x => x.length);
            return segs.slice(noMethod ? -1 : -2).join('.');
        }

        // "· ~18m" (time to finish) or "· starts ~12m" (queued, only the start is predictable).
        // TeamCity URLs carry the test-name hash in its unsigned 64-bit form; the REST id is signed.
        function unsignedTestId(id) {
            try { return (BigInt(id) & 0xFFFFFFFFFFFFFFFFn).toString(); } catch (e) { return id; }
        }

        function chipEta(b) {
            if (b.leftSec != null && b.leftSec >= 0) return ' · ' + fmtLeft(b.leftSec);
            if (b.startSec != null && b.startSec >= 0) return ' · starts ' + fmtLeft(b.startSec);
            return '';
        }

        // "~18m" / "~1h 05m" — TeamCity's estimate of time left for a running build.
        function fmtLeft(sec) {
            if (sec == null || sec < 0) return '';
            if (sec < 60) return '~<1m';
            const m = Math.round(sec / 60);
            return m < 60 ? `~${m}m` : `~${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
        }

        // pass/fail history of the test's finished branch runs (oldest → newest).
        function runStrip(runs) {
            if (!runs) return '';
            const failed = [...runs].filter(c => c === 'F').length;
            const bars = [...runs].map(c => `<span class="run run-${c === 'F' ? 'f' : 'p'}"></span>`).join('');
            return `<span class="strip" title="${runs.length} branch run(s), ${failed} failed (oldest→newest)">${bars}</span>`;
        }

        function render(list, reruns) {
            const el = $('flaky');
            if (!list || !list.length) { el.innerHTML = '<div class="muted">No flaky/broken master tests recorded yet — the queue fills as PRs get analysed (it needs an active login to warm the cache). Check back shortly.</div>'; return; }
            el.innerHTML = list.map((b, i) => {
                const short = esc(shortTestName(b.name));
                const enc = occ => `&expandedTest=${encodeURIComponent(occ).replace(/\(/g, '%28').replace(/\)/g, '%29')}`;
                const mf = b.masterFailures || [];
                const onMaster = tcBase && mf.length;
                const runUrl = onMaster
                    ? `${tcBase}buildConfiguration/${encodeURIComponent(mf[0].btId)}/${mf[0].buildId}`
                    : (tcBase && b.suiteBuildId) ? `${tcBase}buildConfiguration/${encodeURIComponent(b.suite)}/${b.suiteBuildId}` : '';
                const expanded = onMaster ? (mf[0].occ ? enc(mf[0].occ) : '') : (b.occurrenceId ? enc(b.occurrenceId) : '');
                const tcTitle = onMaster ? 'Open the latest master failure in TeamCity' : 'Open this test in TeamCity (PR branch)';
                const nameHtml = runUrl
                    ? short + `<a class="ext" href="${runUrl}?buildTab=tests${expanded}#testNameId${unsignedTestId(b.testId)}" target="_self" rel="noopener" title="${tcTitle}">TC</a>`
                    : short;
                const why = b.occurrenceId ? `<button class="why" data-occ="${esc(b.occurrenceId)}" title="Show the failure message">why?</button>` : '';
                // A live re-run of this suite launched through the tool (running preferred over queued).
                const rr = (reruns || []).find(x => x.buildTypeId === b.suite);
                const live = rr ? `<a class="live ${rr.state === 'running' ? 'running' : 'queued'}" href="${rr.webUrl}" target="_self" rel="noopener" title="This suite's re-run on TeamCity${rr.pct != null && rr.pct >= 0 ? ' · ' + rr.pct + '% complete' : ''}">${esc(rr.state)} · #${rr.pr}${chipEta(rr)}</a>` : '';
                const pct = b.masterRuns ? Math.round(100 * b.masterFails / b.masterRuns) : 0;
                const hot = pct >= 30 ? 'hot' : pct >= 10 ? 'warm' : '';
                return `<div class="lbrow">
                    <div class="lbhead">
                        <span class="lbrank">${i + 1}.</span>
                        <span class="lbname"><span class="lbsuite">${esc(b.suiteName || b.suite)} · </span>${nameHtml}${runStrip(b.branchRuns)}${why}${live}</span>
                        <span class="lbcount"><span class="flake ${hot}">${b.masterFails}/${b.masterRuns} on master</span><span class="foot" title="Seen in PRs: ${b.prs.map(n => '#' + n).join(', ')}">${pct}% · ${b.prCount} PR${b.prCount === 1 ? '' : 's'}</span></span>
                    </div>
                    <div class="lbprs">${mf.length ? 'failed master runs: ' + mf.map(f => `<a href="${tcBase}buildConfiguration/${encodeURIComponent(f.btId)}/${f.buildId}?buildTab=tests${f.occ ? enc(f.occ) : ''}#testNameId${unsignedTestId(b.testId)}" target="_self" rel="noopener" title="Open this failed master run in TeamCity">#${f.buildId}</a>`).join('') : ''}</div>
                    <div class="details hidden"><button class="copy" type="button" title="Copy the failure message">copy</button><pre></pre></div>
                </div>`;
            }).join('');
            for (const btn of el.querySelectorAll('.why')) btn.onclick = () => toggleDetails(btn);
            for (const btn of el.querySelectorAll('.details .copy')) btn.onclick = () => copyDetails(btn);
        }

        // Rough failure triage from the message: environment/timing noise vs a real assertion.
        function failureKind(d) {
            if (/timed out|timeout|Node has not joined|OutOfMemoryError|JVM crash|Connection re(set|fused)|Failed to wait|exit code|Agent unavailable/i.test(d))
                return '♻ environment/timing — a re-run may pass';
            if (/AssertionError|AssertionFailedError|ComparisonFailure|expected:/.test(d))
                return '⚖ assertion — likely a real logic failure';
            return null;
        }

        async function copyDetails(btn) {
            const pre = btn.closest('.details').querySelector('pre');
            const text = pre.dataset.raw || pre.textContent;
            let ok = false;
            try { await navigator.clipboard.writeText(text); ok = true; }
            catch (e) { // no async-clipboard permission: fall back to the legacy path
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { ok = document.execCommand('copy'); } catch (e2) { /* stays not-ok */ }
                ta.remove();
            }
            btn.textContent = ok ? 'copied' : 'copy failed';
            setTimeout(() => { btn.textContent = 'copy'; }, 1500);
        }

        async function toggleDetails(btn) {
            const box = btn.closest('.lbrow').querySelector('.details');
            if (!box) return;
            if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            const pre = box.querySelector('pre');
            if (pre.dataset.loaded) return;
            pre.textContent = 'loading…';
            try {
                const r = await fetch('/api/test-details?occ=' + encodeURIComponent(btn.dataset.occ), { cache: 'no-store' });
                if (r.status === 401) { pre.textContent = 'log in on the main page to see the failure message'; return; }
                const { details } = await r.json().catch(() => ({ details: '' }));
                const kind = details ? failureKind(details) : null;
                pre.dataset.raw = details || '';
                pre.textContent = details && details.trim()
                    ? (kind ? kind + '\n\n' : '') + details
                    : '(no failure message available)';
                pre.dataset.loaded = '1';
            } catch (e) {
                pre.textContent = 'failed to load details';
            }
        }

        async function tick() {
            try {
                const r = await fetch('/api/top-flaky?limit=40', { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();
                const list = data.tests || [];
                const reruns = await fetch('/api/reruns', { cache: 'no-store' }).then(x => x.ok ? x.json() : []).catch(() => []);
                $('err').textContent = '';
                const json = JSON.stringify({ list, reruns });
                if (json !== lastJson) { render(list, reruns); lastJson = json; }
                $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
            } catch (e) {
                // A failed poll with data already on screen is usually a redeploy/restart blip: stay calm,
                // keep the list, and let the next poll clear this. Alarm only when there's nothing to show.
                $('err').textContent = lastJson ? 'connection lost — retrying…' : 'unavailable: ' + e.message;
            }
        }

        async function loadConfig() {
            try {
                const c = await fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
                if (c && c.teamcityUrl) tcBase = c.teamcityUrl.endsWith('/') ? c.teamcityUrl : c.teamcityUrl + '/';
            } catch (e) { /* links just won't be clickable */ }
        }

        (function () {
            const sel = $('theme-toggle');
                sel.value = document.documentElement.getAttribute('data-theme') || 'light';
                sel.addEventListener('change', () => {
                    const t = sel.value;
                    document.documentElement.setAttribute('data-theme', t);
                    try { localStorage.setItem('theme', t); } catch (e) { /* private mode */ }
            });
        })();

        loadConfig().then(() => { tick(); setInterval(tick, 15000); });
    </script>
</body>
</html>
