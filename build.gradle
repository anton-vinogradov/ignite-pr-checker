plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.igniteprchecker'

/** Output of a git command run in the project; null without git or outside a repository. */
String git(String... args) {
    try {
        def run = providers.exec {
            commandLine(['git', '-C', projectDir.absolutePath] + args.toList())
            ignoreExitValue = true
        }
        return run.result.get().exitValue == 0 ? run.standardOutput.asText.get().trim() : null
    }
    catch (Exception ignored) {
        return null
    }
}

// What goes into the jar. A change here, committed or not, untracked files included, makes the build "dirty": its
// commit alone no longer tells the code it runs. deploy.sh checks the same paths.
def jarSources = ['src', 'build.gradle', 'settings.gradle', 'gradle']
def gitCommit = git('rev-parse', 'HEAD')
def gitStatus = git((['status', '--porcelain', '--'] + jarSources) as String[])
def gitDirty = gitCommit != null && (gitStatus == null || !gitStatus.isEmpty())

// Release builds pass -Pappversion=<tag without 'v'> (see .github/workflows/release.yml). Any other build is named
// by git describe, e.g. 1.21.0-3-g5f2c9e1-dirty: three commits after v1.21.0, with uncommitted changes. Outside a
// repository it is 0.0.0-SNAPSHOT, which no release can be mistaken for. Embedded via buildInfo() with the commit.
def described = git('describe', '--tags', '--always')
version = project.findProperty('appversion')
    ?: (described ? described.replaceFirst(/^v/, '') + (gitDirty ? '-dirty' : '') : '0.0.0-SNAPSHOT')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Patch releases newer than Boot 4.1.1 manages: Jackson 3.1.5 has CVEs in jackson-core and jackson-databind (OSV lists
// seven, CVE-2026-89407 among them), Tomcat 11.0.24 has CVE-2026-65182, -65905 and -68525. Drop a pin once Boot
// manages that version or newer.
ext['jackson-bom.version'] = '3.1.8'
ext['tomcat.version'] = '11.0.25'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // The request factories of the TeamCity, JIRA and GitHub clients (OutboundHttp).
    implementation 'org.springframework.boot:spring-boot-http-client'
    // GitHub calls (PATCH included) run on it; checkstyle 10 used to bring it in by accident.
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    // The version Ignite's own build runs, so the style autofix counts violations by the same rules.
    implementation('com.puppycrawl.tools:checkstyle:12.3.1') {
        // A second SLF4J backend next to Logback.
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    constraints {
        // Checkstyle brings plexus-utils 3.3.0 in through doxia; it has CVE-2025-67030, fixed in 3.6.1.
        implementation 'org.codehaus.plexus:plexus-utils:3.6.1'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // TestRestTemplate, which ContextStartsTest calls the started service with, and the RestTemplateBuilder it needs.
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    // Tests render the PR comment by the CommonMark rules GitHub's markdown follows.
    testImplementation 'org.commonmark:commonmark:0.30.1'
}

springBoot {
    // Generates META-INF/build-info.properties so BuildProperties (the app's own version and commit) is available.
    buildInfo {
        properties {
            if (gitCommit) {
                additional.put('commit', gitCommit)
                additional.put('dirty', String.valueOf(gitDirty))
            }
        }
    }
}

tasks.named('bootJar') {
    archiveFileName = 'ignite-pr-checker.jar'
}

tasks.named('bootRun') {
    // application-dev.yml: a local run leaves the shared TeamCity and the PRs alone. SPRING_PROFILES_ACTIVE overrides.
    systemProperty 'spring.profiles.default', 'dev'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Coverage is reported, not enforced: the report shows which paths the tests still miss.
tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
