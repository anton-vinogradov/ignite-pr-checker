server:
  port: 8080

app:
  # The https address users open. Links this instance posts (PR comments, JIRA visas, onboarding replies) point here.
  # Set with APP_PUBLIC_URL; install.sh writes it empty, which the status page reports until it is set.
  public-url: ${APP_PUBLIC_URL:https://ignite-pr-checker.is-a.dev}

logging:
  file:
    # The service's own log, beside the journal, which on a busy host keeps under two days. install.sh sets
    # PRC_LOG_FILE in the unit; unset (a local run) logs to the console only.
    name: ${PRC_LOG_FILE:}
  logback:
    rollingpolicy:
      # A file a day and a month of them, so a complaint from weeks ago can still be looked up.
      max-history: 30
      # A logging loop must not fill the disk.
      total-size-cap: 500MB

spring:
  servlet:
    multipart:
      # No endpoint takes uploads; parsing multipart bodies would only add attack surface.
      enabled: false
  task:
    scheduling:
      pool:
        # The default scheduler is single-threaded; the rerun tracker's refresh makes network calls
        # on it, which would delay the other timers (cache snapshots, warm cycles, flaky harvest).
        size: 3
  jackson:
    deserialization:
      # TeamCity REST responses carry many fields we don't map; ignore the rest.
      fail-on-unknown-properties: false
  web:
    resources:
      cache:
        cachecontrol:
          # Make the browser revalidate index.html/static assets, so a redeploy is picked up
          # immediately instead of serving a stale cached page.
          no-cache: true

# These are non-secret, deployment-wide settings (which TeamCity to talk to, which chain, tuning).
# There are NO credentials here: every user logs in with their own TeamCity token (see /api/login).
teamcity:
  # Base URL of the TeamCity instance (must end with a slash). Override with TC_BASE_URL.
  base-url: ${TC_BASE_URL:https://ci2.ignite.apache.org/}
  # Give up on a TeamCity call that sends nothing for this long (the slowest seen on prod took 3.3 s).
  read-timeout: 60s

github:
  # Repo whose open PRs populate the left-hand list.
  repo: ${GITHUB_REPO:apache/ignite}
  # Token of the checker's own GitHub account (classic, public_repo scope). Reads go under it (5000
  # requests/hour instead of 60), and the checker writes as that account: onboarding replies to PR
  # commands, reactions, hints and the run narration of users without their own GitHub token. Use a
  # separate account without write access to the repo. Empty: read-only, and those commands get no reply.
  token: ${GITHUB_TOKEN:}
  # How long to cache the PR list. Longer = fewer GitHub calls (unauthenticated limit is 60/hour).
  cache-seconds: 300
  # Give up on a GitHub call that sends nothing for this long.
  read-timeout: 60s

jira:
  # The JIRA that visas go to. Override with JIRA_BASE_URL.
  base-url: ${JIRA_BASE_URL:https://issues.apache.org/jira}
  # Give up on a JIRA call that sends nothing for this long.
  read-timeout: 60s

analysis:
  # Branch to compute the "base" test history against.
  base-branch: refs/heads/master
  # buildType id of the composite chain that fans out into the individual suites. Override with TC_RUN_ALL_BUILD_TYPE.
  run-all-build-type: ${TC_RUN_ALL_BUILD_TYPE:IgniteTests24Java8_RunAll}
  # How many recent master runs of a test to inspect. A test that fails in the PR is a blocker unless
  # it also fails at least once in these last master runs. Override with MASTER_HISTORY_DEPTH.
  history-depth: ${MASTER_HISTORY_DEPTH:100}
  # How many TeamCity calls (per-test history / per-suite lookups) to run in parallel during one analysis.
  # Kept modest for the single-core box: though the calls are I/O-bound, each response still costs CPU to
  # parse and turn into verdicts, so a wide fan-out (esp. when a warm refill and a foreground analysis
  # overlap) thrashes the one core and inflates TeamCity latency instead of helping. 8 keeps bursts gentle
  # enough that foreground page loads stay responsive during a refill. Override with ANALYSIS_CONCURRENCY.
  concurrency: ${ANALYSIS_CONCURRENCY:8}
  # How long to cache a test's history on master and on other PRs' branches (per test and suite) and the
  # analysis result (per build). 0 disables caching.
  cache-ttl-minutes: 120
  # On request, a cached result older than this triggers a background refresh (the request still returns instantly).
  refresh-after-seconds: 120
  # Merge of the last N finished branch runs: a test is a hard blocker only if it fails in ALL of the
  # last N runs (no pass on the same code within the window). A single flap (failed only the latest,
  # passed just before) is filtered as flaky-on-branch; failing the last 2+ but passing earlier is a
  # "recently started failing" watch item, not a blocker. Only runs of the SAME VCS revision count as
  # "the same code", so on a branch that keeps getting pushes this window is usually 1-2 runs deep and
  # the streak is reached by re-running the suite. Override with BLOCKER_FAIL_STREAK.
  blocker-fail-streak: ${BLOCKER_FAIL_STREAK:3}

persist:
  # Snapshot the in-memory caches (analysis results, per-test history, PR list) to disk so a
  # restart/redeploy starts warm instead of cold — and doesn't re-hammer TeamCity to re-warm.
  enabled: ${PRC_PERSIST_ENABLED:true}
  # Directory for the snapshot files. Must be writable and survive restarts; if it isn't (e.g. a
  # local dev run), persistence disables itself and the app runs in-memory only. Override with PRC_CACHE_DIR.
  # Daily zips of the snapshot files go to its backups/ subdirectory, the last 7 kept.
  dir: ${PRC_CACHE_DIR:/opt/ignite-pr-checker/cache}
  # How often to re-snapshot the caches to disk, minutes (everything is also written on graceful
  # shutdown). State the service acts on (options, stored tokens, handled commands) is written within
  # a second of a change.
  interval-minutes: 5

warm:
  # Keep the newest PRs pre-analysed (spreading the load across active users' tokens; nothing warms
  # until the first login).
  enabled: true
  # How many of the newest open PRs to keep warm.
  count: 50
  # How often to refresh the warmed PRs, minutes.
  interval-minutes: 10
  # Drop a pooled TeamCity token not re-offered (by a request) within this many minutes — the user
  # has gone. Keep it >= a typical active session so live users' tokens aren't evicted mid-use.
  token-ttl-minutes: 60

automation:
  # Act on PRs in the background under users' stored tokens: the standing-option sweep (visas, re-runs) and /run-all
  # commands in PR comments. Off in the dev profile, so a local run never acts next to the production instance.
  # Override with AUTOMATION_ENABLED.
  enabled: ${AUTOMATION_ENABLED:true}

update:
  # In-app self-update: check the project's GitHub releases and, on request, restart into the new release, which
  # install.sh's update.sh installs as root before the start. Disable with UPDATE_ENABLED=false.
  enabled: ${UPDATE_ENABLED:true}
  # Path of the running jar; the update request and the reason of a failed update are kept beside it. Override with
  # UPDATE_JAR_PATH.
  jar-path: ${UPDATE_JAR_PATH:/opt/ignite-pr-checker/app.jar}

admin:
  # TeamCity usernames, comma-separated, of the operators: only they may restart, update and flush the
  # service and see its user list. Unset: any logged-in user may, but restart/update at most once per
  # 10 minutes and flush once per hour. Set with PRC_ADMINS.
  logins: ${PRC_ADMINS:}

session:
  # A login lasts until logout — there is no session timeout.
  # Must be true in production (behind HTTPS/Caddy) so the session cookie is TLS-only. Override with SESSION_COOKIE_SECURE.
  cookie-secure: ${SESSION_COOKIE_SECURE:false}
  # Stable secret used to encrypt the session cookie. Must be set (and constant) in production, or
  # logins won't survive a restart; install.sh generates one. If empty, a random key is used per run.
  secret: ${SESSION_SECRET:}
