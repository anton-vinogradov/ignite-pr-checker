server:
  port: 8080

spring:
  jackson:
    deserialization:
      # TeamCity REST responses carry many fields we don't map; ignore the rest.
      fail-on-unknown-properties: false

# These are non-secret, deployment-wide settings (which TeamCity to talk to, which chain, tuning).
# There are NO credentials here: every user logs in with their own TeamCity token (see /api/login).
teamcity:
  # Base URL of the TeamCity instance (must end with a slash). Override with TC_BASE_URL.
  base-url: ${TC_BASE_URL:https://ci2.ignite.apache.org/}

github:
  # Repo whose open PRs populate the left-hand list.
  repo: ${GITHUB_REPO:apache/ignite}
  # Optional read token to raise the API rate limit (60 -> 5000/hour). Public-repo scope is enough.
  token: ${GITHUB_TOKEN:}
  # How long to cache the PR list. Longer = fewer GitHub calls (unauthenticated limit is 60/hour).
  cache-seconds: 300

analysis:
  # Branch to compute the "base" test history against.
  base-branch: refs/heads/master
  # buildType id of the composite chain that fans out into the individual suites. Override with TC_RUN_ALL_BUILD_TYPE.
  run-all-build-type: ${TC_RUN_ALL_BUILD_TYPE:IgniteTests24Java8_RunAll}
  # How many recent base-branch runs of a test to inspect when computing its fail rate / flakiness.
  history-depth: 100
  # A failed test is a blocker only if its base-branch fail rate is below this (percent). tcbot default: 4.0
  fail-rate-blocker-threshold-percents: 4.0
  # A test is "flaky" if it flips pass<->fail at least this many times on builds without code changes. tcbot default: 1
  flakiness-status-change-border: 1
  # How many TeamCity calls (per-test history / per-suite lookups) to run in parallel during one analysis.
  concurrency: 12
  # How long to cache base-branch history (per test) and the analysis result (per build). 0 disables caching.
  cache-ttl-minutes: 15
  # On request, a cached result older than this triggers a background refresh (the request still returns instantly).
  refresh-after-seconds: 120

persist:
  # Snapshot the in-memory caches (analysis results, per-test history, PR list) to disk so a
  # restart/redeploy starts warm instead of cold — and doesn't re-hammer TeamCity to re-warm.
  enabled: ${PRC_PERSIST_ENABLED:true}
  # Directory for the snapshot files. Must be writable and survive restarts; if it isn't (e.g. a
  # local dev run), persistence disables itself and the app runs in-memory only. Override with PRC_CACHE_DIR.
  dir: ${PRC_CACHE_DIR:/opt/ignite-pr-checker/cache}
  # How often to re-snapshot to disk, minutes (a snapshot is also written on graceful shutdown).
  interval-minutes: 5

warm:
  # Keep the newest PRs pre-analysed (using an active user's token; nothing warms until the first login).
  enabled: true
  # How many of the newest open PRs to keep warm.
  count: 50
  # How often to refresh the warmed PRs, minutes.
  interval-minutes: 10

session:
  # How long a login stays valid, minutes.
  ttl-minutes: 480
  # Must be true in production (behind HTTPS/Caddy) so the session cookie is TLS-only. Override with SESSION_COOKIE_SECURE.
  cookie-secure: ${SESSION_COOKIE_SECURE:false}
  # Stable secret used to encrypt the session cookie. Must be set (and constant) in production, or
  # logins won't survive a restart; install.sh generates one. If empty, a random key is used per run.
  secret: ${SESSION_SECRET:}
