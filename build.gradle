plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.igniteprchecker'
// Release builds pass -Pappversion=<tag without 'v'> (see .github/workflows/release.yml); deploy.sh
// passes <latest-tag>-dev. The bare fallback is deliberately 0.0.0 so an unversioned build can't
// masquerade as a real release. Embedded via buildInfo() so the app knows its own version.
version = project.findProperty('appversion') ?: '0.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Patch releases newer than Boot 3.5.16 manages: Jackson 2.21.4 has CVE-2026-89407 and CVE-2026-89425,
// Tomcat 10.1.55 has CVE-2026-65182, -65905 and -68525. Drop a pin once Boot manages that version or newer.
ext['jackson-bom.version'] = '2.21.7'
ext['tomcat.version'] = '10.1.60'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // GitHub calls (PATCH included) run on it; checkstyle 10 used to bring it in by accident.
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    // The version Ignite's own build runs, so the style autofix counts violations by the same rules.
    implementation('com.puppycrawl.tools:checkstyle:14.3.0') {
        // A second SLF4J backend next to Logback, and a commons-logging that spring-jcl already replaces.
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    // Generates META-INF/build-info.properties so BuildProperties (the app's own version) is available.
    buildInfo()
}

tasks.named('bootJar') {
    archiveFileName = 'ignite-pr-checker.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
