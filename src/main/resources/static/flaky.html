<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite PR Checker — Flaky tests</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#1cb6ed">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/common.css">
    <style>
        body { margin: 0; }
        .wrap { margin: 1.2rem auto; padding: 0 1.5rem; }
        .section { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--card-bg); padding: 1rem 1.1rem; }

        .leaderboard { display: flex; flex-direction: column; }
        .lbrow { padding: 0.4rem 0; }
        .lbhead { display: flex; align-items: center; gap: 0.5rem; }
        .lbrank { color: var(--muted); font-variant-numeric: tabular-nums; }
        .lbname { flex: 1 1 auto; min-width: 0; font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; display: inline-flex; align-items: center; flex-wrap: wrap; column-gap: 0.35rem; row-gap: 0.1rem; }
        .lbname a.ext, .lbname .why, .lbname .live { margin: 0; }
        .lbsuite { color: var(--muted); }
        /* The two columns on the right, under their headings: as wide in every row as in the heading. */
        .group-row { display: flex; align-items: baseline; gap: 0.5rem; }
        .group-row .group-head { flex: 1 1 auto; }
        .lbcol { flex: none; width: 8.5rem; display: inline-flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.25; }
        .lbcol-prs { justify-content: center; }
        .lbcol-prs small { display: none; }
        .lbcol-head { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.3; }
        .lbcol small { font-size: 0.72rem; color: var(--muted); }
        .lbcol[title] { cursor: help; }
        .flake { font-weight: 600; }
        .flake.warm { color: var(--warn); }
        .flake.hot { color: var(--bad); }
        .live { font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.45em; border-radius: var(--radius-tag); margin-left: 0.45rem; text-decoration: none; vertical-align: middle; white-space: nowrap; }
        .live.running { background: var(--ok-bg); color: var(--ok); }
        .live.queued { background: var(--warn-bg); color: var(--warn); }
        .details { margin: 0.3rem 0 0.1rem 1.6rem; background: var(--details-bg); border-radius: var(--radius); }
        .details-acts { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0.4rem 0.7rem 0; }
        .details p { margin: 0.35rem 0 0; padding: 0 0.7rem; font-size: 0.78rem; color: var(--muted); }
        .details p a { margin: 0; }
        .details pre { margin: 0; padding: 0.3rem 0.7rem 0.5rem; font-size: 0.72rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
        .details pre .why { margin-left: 0.3rem; }
        .updated { font-size: 0.78rem; color: var(--muted); text-align: right; margin: 0.9rem 0 0.2rem; }
        .intro { color: var(--muted); font-size: 0.88rem; margin: 0 0 0.8rem; max-width: 60rem; }
        .group-head { font-size: 1rem; margin: 0.2rem 0 0.1rem; }
        .group-sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 0.4rem; }
        .group-row:not(:first-child) { margin-top: 1.2rem; }

        html[data-theme="terminal"] {
            .live { padding: 0 0.15rem; }
        }
        @media (max-width: 768px) {
            .wrap { padding: 0 0.75rem; }
            .lbhead, .group-row { flex-wrap: wrap; }
            .lbcol { width: auto; flex-direction: row; gap: 0.35rem; align-items: baseline; }
            .lbcol-head { display: none; }
            .lbcol-prs small { display: inline; }
            .lbcol-prs .prs-none { display: none; }
            .details { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" title="Start page">Ignite PR Checker</a>
        <nav class="menu" aria-label="Pages">
            <a href="/" target="_self" title="Shows the open PRs and their verdicts.">PRs</a>
            <a href="/flaky.html" target="_self" aria-current="page" title="Shows the tests that fail on master.">Flaky tests</a>
            <a href="/status.html" target="_self" title="Shows the service status and metrics.">Status</a>
        </nav>
        <div class="topbar-right">
            <button id="reloadPill" class="update-btn hidden" type="button"
                title="This page's code was updated by a deploy — reload to get the new UI">UI updated — reload</button>
            <a class="star-btn" href="https://github.com/anton-vinogradov/ignite-pr-checker"
               target="_self" rel="noopener" title="Star this project on GitHub">
                <svg class="star-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M8 12.472l-4.702 2.833 1.248-5.351L.42 6.354l5.472-.464L8 .833l2.108 5.057 5.472.464-4.126 3.6 1.248 5.351z"/>
                </svg>
                <span>Star</span>
            </a>
            <select id="theme-toggle" class="theme-sel" title="Theme" aria-label="Theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="jetbrains">JetBrains</option>
                <option value="terminal">Terminal</option>
            </select>
        </div>
    </header>

    <div class="wrap">
        <div id="err" class="muted"></div>
        <p class="intro"><span id="intro">Tests that fail on master, so they also fail in PRs that did not break them. Tests
            muted on TeamCity are not shown.</span>
            <a class="help" href="https://github.com/anton-vinogradov/ignite-pr-checker/blob/main/docs/features.md#the-flaky-board-flakyhtml" target="_self" rel="noopener" title="How this board works" aria-label="How this board works">?</a></p>
        <div class="section"><div id="flaky" class="leaderboard"></div></div>
        <div class="updated" id="updated"></div>
    </div>

    <script src="/common.js"></script>
    <script src="/flaky.js"></script>
</body>
</html>
