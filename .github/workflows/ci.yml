name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      deploy-artifact:
        description: Keep the checked JAR for this run's Deploy job
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact ID of the checked JAR in this workflow run
        value: ${{ jobs.build.outputs.artifact-id }}
      version:
        description: Version embedded in the checked JAR
        value: ${{ jobs.build.outputs.version }}
      sha256:
        description: SHA-256 of the checked JAR
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

jobs:
  build:
    if: >-
      !inputs.deploy-artifact || (github.repository == 'anton-vinogradov/ignite-pr-checker' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      PRC_DEPLOY_NUMBER: ${{ inputs.deploy-artifact && github.run_number || '' }}
    outputs:
      artifact-id: ${{ steps.deploy-jar.outputs.artifact-id }}
      version: ${{ steps.jar.outputs.version }}
      sha256: ${{ steps.jar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.deploy-artifact && '0' || '1' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Names the file and line of a syntax error, also in a script no page test loads.
      - name: Check the page scripts
        run: |
          for f in src/main/resources/static/*.js; do
            node --check "$f"
          done

      - name: Check deployment transactions
        run: python3 -B -m unittest discover -s ops/tests

      # Names the section where a Russian doc's counts, numbers, quoted code or bold names differ from its English twin,
      # or the setting the README leaves out.
      - name: Check the docs
        run: |
          chmod +x ./gradlew
          ./gradlew test --tests 'com.github.igniteprchecker.Doc*Test' --tests com.github.igniteprchecker.ReadmeSettingsTest

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Read the checked deploy JAR
        if: inputs.deploy-artifact
        id: jar
        run: |
          jar=build/libs/ignite-pr-checker.jar
          info="$RUNNER_TEMP/deploy-build-info.properties"
          unzip -p "$jar" META-INF/build-info.properties > "$info"
          version="$(sed -n 's/^build\.version=//p' "$info")"
          commit="$(sed -n 's/^build\.commit=//p' "$info")"
          dirty="$(sed -n 's/^build\.dirty=//p' "$info")"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9]+-g[0-9a-f]+)?-deploy\.$GITHUB_RUN_NUMBER$ ]]
          [ "$commit" = "$GITHUB_SHA" ]
          [ "$dirty" = false ]
          printf 'version=%s\nsha256=%s\n' "$version" "$(sha256sum "$jar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Keep the checked deploy JAR
        if: inputs.deploy-artifact
        id: deploy-jar
        uses: actions/upload-artifact@v4
        with:
          name: deploy-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/libs/ignite-pr-checker.jar
          if-no-files-found: error

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/reports/jacoco/test/
